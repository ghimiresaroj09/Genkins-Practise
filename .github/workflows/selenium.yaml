name: Selenium Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium Tests
        run: |
          pytest --browser=chrome --headless=true --alluredir=allure-results

      - name: Test Summary
        if: always()
        run: |
          echo "## Selenium Automation Execution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Chrome |" >> $GITHUB_STEP_SUMMARY
          echo "| Headless | True |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | 3.11 |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | ubuntu-latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ vars.EMAIL_USERNAME }}
          password: ${{ vars.EMAIL_PASSWORD }}

          subject: "Selenium Automation - ${{ job.status }}"

          to: ${{ vars.EMAIL_TO }}
          from: GitHub Actions

          body: |
            Hello,

            Your Selenium automation workflow has completed.

            ----------------------------------------
            Repository : ${{ github.repository }}
            Workflow   : ${{ github.workflow }}
            Branch     : ${{ github.ref_name }}
            Status     : ${{ job.status }}
            Triggered By : ${{ github.actor }}
            Commit SHA : ${{ github.sha }}
            ----------------------------------------

            View Workflow:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Artifacts uploaded:
            • Allure Results
            • Screenshots
            • Logs

            Regards,
            GitHub Actions