name: Selenium Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  selenium-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      report-url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Run Selenium Tests
        run: |
          pytest --browser=chrome --headless=true --alluredir=allure-results

      - name: Generate Allure HTML Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Test Summary
        if: always()
        run: |
          echo "## Selenium Automation Execution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Chrome |" >> $GITHUB_STEP_SUMMARY
          echo "| Headless | True |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | 3.11 |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | ubuntu-latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:

    needs: selenium-tests

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "Selenium Automation - ${{ job.status }}"

          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions

          body: |
            Hello,

            Your Selenium automation workflow has completed.

            ----------------------------------------
            Repository : ${{ github.repository }}
            Workflow   : ${{ github.workflow }}
            Branch     : ${{ github.ref_name }}
            Status     : ${{ needs.selenium-tests.result }}
            Triggered By : ${{ github.actor }}
            Commit SHA : ${{ github.sha }}
            ----------------------------------------

            Workflow:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Allure Report:
            ${{ steps.deployment.outputs.page_url }}

            Regards,
            GitHub Actions